<!DOCTYPE html>
<html>
<head>
    <title>Add Person</title>
</head>
<body>
    <h1>Add a New Person</h1>

        <input type="text" name="name" required><br><br>

    </form>
    <br>
    <a href="/">Back to List</a>
</body>
</html>
